name: Validate PHP 7.2.34 source backport
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        php: ['7.2.34']
    steps:
      - uses: actions/checkout@v4
      - name: Check patch integrity
        run: sha256sum -c SHA256SUMS
      - name: Install laboratory build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf bison re2c python3 patch
      - name: Download and verify official source
        env:
          PHP_SOURCE_VERSION: ${{ matrix.php }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          source = next(x for x in json.loads(pathlib.Path('sources.json').read_text()) if x['version'] == os.environ['PHP_SOURCE_VERSION'])
          data = urllib.request.urlopen(source['url'], timeout=90).read()
          assert hashlib.sha256(data).hexdigest() == source['sha256'], 'Source checksum mismatch'
          pathlib.Path('source.tar').write_bytes(data)
          PY
          mkdir build
          tar -xf source.tar -C build
      - name: Check and prepare source
        env:
          PHP_SOURCE_VERSION: ${{ matrix.php }}
        run: |
          python3 tools/prepare-source.py "build/php-$PHP_SOURCE_VERSION"
          python3 tools/prepare-source.py "build/php-$PHP_SOURCE_VERSION" --apply
      - name: Build minimal CLI, CGI and FPM
        env:
          PHP_SOURCE_VERSION: ${{ matrix.php }}
        run: |
          cd "build/php-$PHP_SOURCE_VERSION"
          ./configure --disable-all --enable-cli --enable-cgi --enable-fpm --enable-session --enable-json --enable-hash --enable-filter
          make -j2
      - name: Exercise local CLI and CGI fixtures
        env:
          PHP_SOURCE_VERSION: ${{ matrix.php }}
        run: python3 tests/check-runtime.py "build/php-$PHP_SOURCE_VERSION/sapi/cli/php" "build/php-$PHP_SOURCE_VERSION/sapi/cgi/php-cgi"
